{% extends "layout/index.html" %}
{% load static %}

{% block title %}Members{% endblock %}

{% block content %}
            <div class="page-wrapper">
                <header class="page-heading clearfix">
                    <h1 class="heading-title pull-left"><a href="{{ single_project.url_project }}">{{ single_project.project }}</a></h1>
                </header> 
            </div>
            <div class="page-content">
                <div class="row page-row">
                    {% if single_project.image %}
                    <figure class="thumb col-md-10 col-sm-9 col-xs-8">
                        <img src="{{ single_project.image.url }}" style="width: 90px; height: 100px;" class="img-responsive" alt=""/>
                    </figure>
                    {% endif %}
                </div>
                <div class="row page-row">
                        <div class="news-wrapper col-md-10 col-sm-7">                         
                            <article class="news-item page-row has-divider clearfix row">
                                <div class="details col-md-10 col-sm-9 col-xs-8">
                                    <p style="text-align: justify; alignment-adjust: auto">{{ single_project.description }}</p>
                                </div>
                            </article><!--//news-item-->
                        </div>
                </div>
            </div>
{% endblock content %}
